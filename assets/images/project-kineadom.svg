<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00b4d8;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0077a8;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#21262d" stroke-width="1" opacity="0.6">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Cyan accent bar top -->
  <rect x="0" y="0" width="800" height="4" fill="url(#pulse)"/>

  <!-- Icon circle -->
  <circle cx="400" cy="170" r="60" fill="#161b22" stroke="#00b4d8" stroke-width="2" opacity="0.9"/>
  <!-- Medical cross / pulse icon -->
  <text x="400" y="188" font-family="Arial,sans-serif" font-size="52" fill="#00b4d8" text-anchor="middle">🏥</text>

  <!-- Title -->
  <text x="400" y="270" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#e6edf3" text-anchor="middle">Kiné@dom Nice</text>

  <!-- Subtitle -->
  <text x="400" y="305" font-family="Arial,sans-serif" font-size="15" fill="#8b949e" text-anchor="middle">Alternance 1ère année BTS SIO SISR · 10 mois</text>

  <!-- Tags -->
  <rect x="235" y="330" width="105" height="28" rx="14" fill="#0d1117" stroke="#00b4d8" stroke-width="1.5"/>
  <text x="287" y="349" font-family="Arial,sans-serif" font-size="12" fill="#00b4d8" text-anchor="middle">ITIL N1/N2</text>

  <rect x="350" y="330" width="105" height="28" rx="14" fill="#0d1117" stroke="#00b4d8" stroke-width="1.5"/>
  <text x="402" y="349" font-family="Arial,sans-serif" font-size="12" fill="#00b4d8" text-anchor="middle">Ephycient</text>

  <rect x="465" y="330" width="105" height="28" rx="14" fill="#0d1117" stroke="#00b4d8" stroke-width="1.5"/>
  <text x="517" y="349" font-family="Arial,sans-serif" font-size="12" fill="#00b4d8" text-anchor="middle">15 postes</text>
</svg>
