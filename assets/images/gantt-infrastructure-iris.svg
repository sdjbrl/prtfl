<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" width="780" height="430" font-family="Poppins, Arial, sans-serif">

  <!-- Background -->
  <rect width="780" height="430" fill="#1d1d2e" rx="14"/>

  <!-- Title -->
  <text x="390" y="28" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">Infrastructure IRIS — Diagramme de Gantt</text>
  <text x="390" y="46" text-anchor="middle" fill="#888899" font-size="11">Semaine intensive · Réseau + Virtualisation + RADIUS</text>

  <!-- Vertical grid -->
  <line x1="240" y1="58" x2="240" y2="402" stroke="#2a2a3e" stroke-width="1"/>
  <line x1="348" y1="58" x2="348" y2="402" stroke="#2a2a3e" stroke-width="1"/>
  <line x1="456" y1="58" x2="456" y2="402" stroke="#2a2a3e" stroke-width="1"/>
  <line x1="564" y1="58" x2="564" y2="402" stroke="#2a2a3e" stroke-width="1"/>
  <line x1="672" y1="58" x2="672" y2="402" stroke="#2a2a3e" stroke-width="1"/>
  <line x1="780" y1="58" x2="780" y2="402" stroke="#2a2a3e" stroke-width="1"/>

  <!-- Day headers -->
  <rect x="240" y="58" width="108" height="22" fill="#26263a"/>
  <text x="294" y="73" text-anchor="middle" fill="#bbbbcc" font-size="10" font-weight="500">Lun — Analyse</text>
  <rect x="348" y="58" width="108" height="22" fill="#26263a"/>
  <text x="402" y="73" text-anchor="middle" fill="#bbbbcc" font-size="10" font-weight="500">Mar — Réseau</text>
  <rect x="456" y="58" width="108" height="22" fill="#26263a"/>
  <text x="510" y="73" text-anchor="middle" fill="#bbbbcc" font-size="10" font-weight="500">Mer — Serveur</text>
  <rect x="564" y="58" width="108" height="22" fill="#26263a"/>
  <text x="618" y="73" text-anchor="middle" fill="#bbbbcc" font-size="10" font-weight="500">Jeu — Intégration</text>
  <rect x="672" y="58" width="108" height="22" fill="#26263a"/>
  <text x="726" y="73" text-anchor="middle" fill="#bbbbcc" font-size="10" font-weight="500">Ven — Soutenance</text>

  <!-- Alternating row backgrounds -->
  <rect x="0" y="80"  width="780" height="34" fill="#22223a"/>
  <rect x="0" y="114" width="780" height="34" fill="#1d1d2e"/>
  <rect x="0" y="148" width="780" height="34" fill="#22223a"/>
  <rect x="0" y="182" width="780" height="34" fill="#1d1d2e"/>
  <rect x="0" y="216" width="780" height="34" fill="#22223a"/>
  <rect x="0" y="250" width="780" height="34" fill="#1d1d2e"/>
  <rect x="0" y="284" width="780" height="34" fill="#22223a"/>
  <rect x="0" y="318" width="780" height="34" fill="#1d1d2e"/>

  <!-- Task labels -->
  <text x="234" y="102" text-anchor="end" fill="#d4d4d8" font-size="11">Analyse besoin &amp; cadrage</text>
  <text x="234" y="136" text-anchor="end" fill="#d4d4d8" font-size="11">Benchmarks &amp; architecture</text>
  <text x="234" y="170" text-anchor="end" fill="#d4d4d8" font-size="11">Config switches / VLANs</text>
  <text x="234" y="204" text-anchor="end" fill="#d4d4d8" font-size="11">WiFi + ACLs inter-VLAN</text>
  <text x="234" y="238" text-anchor="end" fill="#d4d4d8" font-size="11">FreeRADIUS + 802.1X</text>
  <text x="234" y="272" text-anchor="end" fill="#d4d4d8" font-size="11">Stack KVM + Docker</text>
  <text x="234" y="306" text-anchor="end" fill="#d4d4d8" font-size="11">VM étudiantes + intégration</text>
  <text x="234" y="340" text-anchor="end" fill="#d4d4d8" font-size="11">Tests, docs &amp; soutenance</text>

  <!-- GANTT BARS -->
  <!-- Row 0: Analyse besoin — Lun full -->
  <rect x="242" y="86" width="104" height="22" fill="#f3a94a" rx="5"/>
  <!-- Row 1: Benchmarks & architecture — Lun pm + Mar full -->
  <rect x="294" y="120" width="158" height="22" fill="#f3a94a" rx="5"/>
  <!-- Row 2: Config switches / VLANs — Mar full -->
  <rect x="350" y="154" width="104" height="22" fill="#e05c5c" rx="5"/>
  <!-- Row 3: WiFi + ACLs — Mar pm + Mer am -->
  <rect x="402" y="188" width="106" height="22" fill="#e05c5c" rx="5"/>
  <!-- Row 4: FreeRADIUS + 802.1X — Mer full -->
  <rect x="458" y="222" width="104" height="22" fill="#e05c5c" rx="5"/>
  <!-- Row 5: Stack KVM + Docker — Mer pm + Jeu am -->
  <rect x="510" y="256" width="106" height="22" fill="#5c9ade" rx="5"/>
  <!-- Row 6: VM étudiantes + intégration — Jeu full -->
  <rect x="566" y="290" width="104" height="22" fill="#5c9ade" rx="5"/>
  <!-- Row 7: Tests, docs & soutenance — Jeu pm + Ven full -->
  <rect x="618" y="324" width="158" height="22" fill="#7c5cde" rx="5"/>

  <!-- Legend -->
  <rect x="240" y="412" width="11" height="11" fill="#f3a94a" rx="3"/>
  <text x="255" y="422" fill="#888899" font-size="10">Analyse / Architecture</text>
  <rect x="400" y="412" width="11" height="11" fill="#e05c5c" rx="3"/>
  <text x="415" y="422" fill="#888899" font-size="10">Réseau / RADIUS</text>
  <rect x="545" y="412" width="11" height="11" fill="#5c9ade" rx="3"/>
  <text x="560" y="422" fill="#888899" font-size="10">Virtualisation / VM</text>
  <rect x="700" y="412" width="11" height="11" fill="#7c5cde" rx="3"/>
  <text x="715" y="422" fill="#888899" font-size="10">Tests &amp; soutenance</text>

</svg>
