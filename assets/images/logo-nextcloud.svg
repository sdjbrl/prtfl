<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg2)"/>

  <!-- Nextcloud Logo — centered -->
  <g transform="translate(400,195)">
    <!-- Cloud shape -->
    <!-- Main cloud body -->
    <ellipse cx="0" cy="18" rx="80" ry="45" fill="#0082c9"/>
    <!-- Left bump -->
    <circle cx="-52" cy="2" r="30" fill="#0082c9"/>
    <!-- Right bump -->
    <circle cx="52" cy="2" r="30" fill="#0082c9"/>
    <!-- Top bump (center) -->
    <circle cx="0" cy="-18" r="36" fill="#0082c9"/>
    <!-- White dots -->
    <circle cx="-34" cy="22" r="10" fill="white"/>
    <circle cx="0"   cy="28" r="10" fill="white"/>
    <circle cx="34"  cy="22" r="10" fill="white"/>
  </g>

  <!-- Wordmark -->
  <text x="400" y="310" font-family="'Open Sans', Arial, sans-serif" font-size="44" font-weight="700"
        fill="#ffffff" text-anchor="middle" dominant-baseline="middle">Nextcloud</text>

  <!-- Tagline -->
  <text x="400" y="352" font-family="Arial, sans-serif" font-size="13" font-weight="400"
        fill="#94a3b8" text-anchor="middle" letter-spacing="2">SELF-HOSTED CLOUD STORAGE</text>
</svg>
