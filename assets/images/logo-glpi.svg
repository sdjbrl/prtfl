<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- GLPI Logo Group — centered at 400,225 -->
  <g transform="translate(400,225)">

    <!-- Icon: rounded square badge -->
    <rect x="-115" y="-55" width="90" height="90" rx="18" fill="#074a74"/>
    <!-- G letter simplified -->
    <text x="-70" y="12" font-family="Arial Black, sans-serif" font-size="52" font-weight="900"
          fill="#fc9a3a" text-anchor="middle" dominant-baseline="middle">G</text>

    <!-- Wordmark: LPI -->
    <text x="15" y="-8" font-family="Arial Black, sans-serif" font-size="58" font-weight="900"
          fill="#ffffff" text-anchor="start" dominant-baseline="middle">LPI</text>

    <!-- Tagline -->
    <text x="-70" y="58" font-family="Arial, sans-serif" font-size="13" font-weight="400"
          fill="#94a3b8" text-anchor="middle" letter-spacing="2">IT MANAGEMENT</text>
  </g>
</svg>
